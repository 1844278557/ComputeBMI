name: DayPulse APK Build

on:
  push:
    branches:
      - agent/daypulse-apk-build
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore DayPulse project
        shell: bash
        run: |
          set -euxo pipefail
          cat .daypulse/chunk*.b64 | base64 -d > /tmp/daypulse.zip
          unzip -t /tmp/daypulse.zip
          unzip -q /tmp/daypulse.zip -d /tmp/daypulse-src
          cp -a /tmp/daypulse-src/DayPulse ./DayPulse

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5'

      - name: Install Android API 37
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-37'

      - name: Build debug APK
        working-directory: DayPulse
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DayPulse-debug-apk
          path: DayPulse/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
